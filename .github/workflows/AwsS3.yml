name: Main CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: git clone
        uses: actions/checkout@v2

      - name: npm install
        run: npm install

      - name: npm build
        env:
          VUE_APP_API_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${VUE_APP_API_URL//[[:space:]]/}" ]; then
            echo "::error::Repository variable API_BASE_URL is required. Set it to the backend origin, for example https://api.example.com (no trailing slash, no /ws)."
            exit 1
          fi
          echo "Building with API base URL from repository variable API_BASE_URL"
          npm run build

      - name: deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp --recursive --region ap-northeast-2 dist s3://jamye-frontend

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID//[[:space:]]/}" ]; then
            echo "::error::Secret CLOUDFRONT_DISTRIBUTION_ID is required. filenameHashing is disabled, so unchanged filenames stay cached until CloudFront is invalidated."
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
